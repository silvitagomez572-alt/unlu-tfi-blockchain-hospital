apiVersion: v1
kind: ConfigMap
metadata:
  name: hisjb-console
  labels: {project: hisjb-tfi}
data:
  index.html: |
{{ .Files.Get "console/index.html" | replace "content=\"local\"" (printf "content=\"%s\"" .Values.environment) | replace "__PROJECT__" .Values.projectId | replace "__NAMESPACE__" .Release.Namespace | indent 4 }}
  app.js: |
{{ .Files.Get "console/app.js" | indent 4 }}
  style.css: |
{{ .Files.Get "console/style.css" | indent 4 }}
