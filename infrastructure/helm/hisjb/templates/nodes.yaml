{{- if ne .Release.Namespace "tfi-hospital" }}{{ fail "namespace must be tfi-hospital" }}{{ end }}
{{- if not (has (int .Values.replicas) (list 1 3 5)) }}{{ fail "replicas must be 1, 3 or 5" }}{{ end }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) }}{{ fail "immutable image digest required" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hisjb
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: hisjb-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: hisjb}
  ports:
    - name: http
      port: 19980
      targetPort: http
---
# Adapted from reference/lab8/helm/charts/pow/templates/statefulset.yaml.
# Stable identities and independent claims retained; no copy of its blockchain engine.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hisjb
  labels: {app: hisjb, project: hisjb-tfi}
spec:
  replicas: {{ .Values.replicas }}
  serviceName: hisjb-headless
  podManagementPolicy: Parallel
  # Difficulty/network experiments cannot mix incompatible protocol profiles.
  # The bounded operator replaces only outdated HISJB pods, retaining all PVCs.
  updateStrategy: {type: OnDelete}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: {app: hisjb}
  template:
    metadata:
      labels: {app: hisjb, project: hisjb-tfi}
      annotations:
        checksum/console: {{ printf "%s%s" (.Files.Get "console/index.html") (.Files.Get "console/app.js") | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "19980"
    spec:
      serviceAccountName: hisjb
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: node
          image: "{{ required "image repository required" .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 19980
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: TFI_REPLICAS
              value: {{ .Values.replicas | quote }}
            - name: TFI_EXPERIMENT
              value: {{ .Values.experiment | quote }}
            - name: TFI_DIFFICULTY
              value: {{ .Values.difficulty | quote }}
            - name: TFI_DIFFICULTY_MODE
              value: {{ .Values.difficultyMode | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: console, mountPath: /app/webconsole/static, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: credentials, mountPath: /run/hisjb, readOnly: true}
            - {name: actors, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
      volumes:
        - name: console
          configMap: {name: hisjb-console}
        - name: credentials
          secret: {secretName: {{ .Values.credentialsSecret }}, defaultMode: 0440}
        - name: actors
          configMap: {name: {{ .Values.actorsConfigMap }}}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {project: hisjb-tfi}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests: {storage: {{ .Values.storageSize }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hisjb-isolation
spec:
  podSelector: {matchLabels: {app: hisjb}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {project: hisjb-tfi}}
      ports: [{protocol: TCP, port: 19980}]
  egress:
    - to:
        - podSelector: {matchLabels: {app: hisjb}}
      ports: [{protocol: TCP, port: 19980}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    # Exact DNS Service observed in the exclusive 10.74.0.0/24 service range.
    - to:
        - ipBlock: {cidr: 10.74.0.10/32}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
